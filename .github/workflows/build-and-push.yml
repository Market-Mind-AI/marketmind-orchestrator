name: Build and Push

# MarketMind lives in the Market-Mind-AI GitHub org but deploys to BeProfit's
# AKS, whose manifests live in equifina/beprofit-infra-manifests. That org
# boundary shapes two steps here:
#
#   1. The image goes to THIS org's GHCR (ghcr.io/market-mind-ai), which the
#      built-in secrets.GITHUB_TOKEN is allowed to write. The cluster pulls it
#      with a separate read:packages secret.
#   2. The tag bump commits into a repo in ANOTHER org, which GITHUB_TOKEN
#      cannot reach at all. That step needs INFRA_REPO_TOKEN — an org-level
#      secret in Market-Mind-AI holding a fine-grained PAT scoped to
#      Contents: write on equifina/beprofit-infra-manifests.
#
# Modelled on beprofit-quota-management's workflow so both orgs deploy the same
# way. Full runbook: marketmind-core/docs/marketmind-deploy-azure-beprofit.md

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Two pushes in quick succession would otherwise race to rewrite the same
  # line in the same values file, and the winner would be whichever build
  # happened to finish last rather than the newer commit.
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hardcoded lowercase instead of ${{ github.repository_owner }}, which
  # renders as "Market-Mind-AI". GHCR normalises the path to lowercase on push,
  # so the pushed name would not match the mixed-case string written into the
  # values file — the pull would then 404 at rollout time.
  IMAGE: ghcr.io/market-mind-ai/marketmind-orchestrator
  ENV_TAG: marketmind-dev
  VALUES_FILE: env/marketmind-dev/orchestrator-values.yaml

jobs:
  test:
    # Unit tests only: the checkpointer tests run in memory and the scoring
    # service is mocked, so no database or network is needed.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install poetry==2.4.1
          poetry install --no-interaction --no-root
      - name: Run the test suite
        run: poetry run pytest -q

  build-and-push:
    needs: test
    # Native arm64, nothing emulated. Every node in the BeProfit AKS clusters is
    # Ampere arm64 (Standard_D4pls_v5 / D2ps_v5), so an amd64 image never
    # schedules — it fails as an unsatisfiable node constraint at rollout, long
    # after a green build. Reaching arm64 from an x86 runner means QEMU inside
    # BuildKit: slow, and occasionally wrong in ways that read as flaky CI.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.ENV_TAG }}-latest
            type=raw,value=${{ steps.image.outputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate infra checkout token
        # Read through env rather than interpolating ${{ secrets.* }} straight
        # into the script. Interpolation splices the value into the shell source
        # before bash parses it, so anything in the token that is shell-special
        # changes the meaning of the script instead of being tested by it. The
        # length is safe to print — GitHub masks the value itself — and is what
        # distinguishes "secret not reaching this repo" from "secret malformed".
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          echo "INFRA_REPO_TOKEN length: ${#INFRA_REPO_TOKEN}"
          if [[ -z "$INFRA_REPO_TOKEN" ]]; then
            echo "Missing required secret: INFRA_REPO_TOKEN."
            echo "Create it as an organisation secret in Market-Mind-AI: a"
            echo "fine-grained PAT with Contents: write on"
            echo "equifina/beprofit-infra-manifests."
            exit 1
          fi

      - name: Checkout infra-manifests
        uses: actions/checkout@v4
        with:
          repository: equifina/beprofit-infra-manifests
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: main
          path: infra-manifests

      - name: Bump the image tag
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          FILE="infra-manifests/${VALUES_FILE}"
          if [[ ! -f "$FILE" ]]; then
            echo "Values file not found: $FILE"
            exit 1
          fi
          # Anchored to the top-level `image:` block so a `tag:` appearing
          # anywhere else in the file is left alone.
          perl -0777 -i -pe \
            's/(^image:\s*\n\s*repository:[^\n]*\n\s*tag:\s*)[^\n]+/${1}"$ENV{IMAGE_TAG}"/m' \
            "$FILE"
          grep -n -A2 '^image:' "$FILE"

      - name: Commit and push the bump
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        working-directory: infra-manifests
        run: |
          set -euo pipefail
          if git diff --quiet -- "$VALUES_FILE"; then
            echo "No change in $VALUES_FILE; skipping commit."
            exit 0
          fi
          git config user.name  "marketmind-ci[bot]"
          git config user.email "marketmind-ci[bot]@users.noreply.github.com"
          git add "$VALUES_FILE"
          git commit -m "chore(orchestrator): update ${ENV_TAG} image to ${IMAGE_TAG}"
          # Six MarketMind repos push into this same repo, and BeProfit's own
          # services push into it too. A rejected push here means someone else
          # landed first, not that anything is broken.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 3
          done
          echo "Failed to push the tag bump after 5 attempts." >&2
          exit 1
