[tool.poetry]
name = "marketmind-orchestrator"
version = "0.1.0"
description = "Orchestrator for the MarketMind pipeline using LangGraph"
authors = ["MarketMind"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.34,<1.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
# LangGraph 1.x, not the 0.2 this was pinned to. The persistence API — which is
# the whole point of this step — changed shape between them, and developing
# against one version while the image runs another is how a checkpointer
# appears to work everywhere except in production.
langgraph = "^1.2.0"
langgraph-checkpoint-postgres = "^3.1.0"
# The checkpointer talks to Postgres through psycopg, and needs the binary
# wheel: without it the import fails at startup with "no pq wrapper available".
psycopg = {extras = ["binary", "pool"], version = "^3.3.0"}
httpx = "^0.28.0"
langchain = "^1.4.0"
langchain-core = "^1.6.0"
langchain-anthropic = "^1.7.0"
langchain-openai = "^1.6.0"
langfuse = "^4.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
respx = "^0.22.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
