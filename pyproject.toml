[tool.poetry]
name = "marketmind-orchestrator"
version = "0.1.0"
description = "Orchestrator for the MarketMind pipeline using LangGraph"
authors = ["MarketMind"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
langgraph = "^0.2.61"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
respx = "^0.22.0"
